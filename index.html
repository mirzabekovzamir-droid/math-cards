<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#4f46e5"/>
  <title>МатеМатика — РШМ</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <header class="header">
    <div class="logo">📐 МатеМатика</div>
    <nav class="nav">
      <button class="nav-btn active" data-view="home">🏠 Главная</button>
      <button class="nav-btn" data-view="review">
        🔁 На повторение <span id="review-count" class="badge">0</span>
      </button>
      <button class="nav-btn" data-view="stats">📊 Прогресс</button>
    </nav>
  </header>

  <main id="app"></main>

  <div id="card-modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="card-container"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
